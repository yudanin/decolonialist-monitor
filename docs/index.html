<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECOLONIAL.IST · Opportunity Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEFEC; --panel:#F6F7F5; --ink:#14201E; --ink-soft:#3E4E4A;
  --rule:#C9CFC9; --rule-soft:#DDE1DC;
  --stamp:#7A2E2E; --stamp-ink:#F6EFEA;
  --verdi:#1D5C55; --amber:#8A6D1F;
  --cell:#7A2E2E; --cell-empty:#DFE3DE;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --disp:"Archivo",sans-serif; --body:"Spectral",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;
  background-image:linear-gradient(var(--rule-soft) 1px,transparent 1px);
  background-size:100% 3.25rem;min-height:100vh}
a{color:var(--verdi)}
button{font-family:var(--mono);cursor:pointer}
:focus-visible{outline:2px solid var(--verdi);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- header ---------- */
header{border-bottom:2px solid var(--ink);background:var(--paper);padding:1.1rem 1.5rem .9rem}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;max-width:76rem;margin:0 auto;flex-wrap:wrap}
.wordmark{font-family:var(--disp);font-weight:900;font-size:1.35rem;letter-spacing:.02em}
.wordmark small{font-family:var(--mono);font-weight:500;font-size:.7rem;letter-spacing:.22em;
  color:var(--stamp);display:block;text-transform:uppercase;margin-top:.15rem}
.hmeta{font-family:var(--mono);font-size:.72rem;color:var(--ink-soft);display:flex;gap:1.1rem;align-items:center}
.hmeta button{background:none;border:1px solid var(--ink);padding:.35rem .7rem;font-size:.72rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.hmeta button:hover{background:var(--ink);color:var(--paper)}

/* ---------- filters ---------- */
.filters{max-width:76rem;margin:1.1rem auto .4rem;padding:0 1.5rem;display:flex;gap:.6rem;
  flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:.75rem}
.chip{border:1px solid var(--ink);background:var(--panel);padding:.3rem .7rem;letter-spacing:.05em;
  text-transform:uppercase;font-size:.7rem;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.filters select,.filters input[type=search]{font-family:var(--mono);font-size:.75rem;padding:.32rem .5rem;
  border:1px solid var(--rule);background:var(--panel);color:var(--ink)}
.filters input[type=search]{flex:1;min-width:10rem}
.count{margin-left:auto;color:var(--ink-soft)}

/* ---------- list ---------- */
main{max-width:76rem;margin:0 auto 4rem;padding:0 1.5rem}
.colhead{display:grid;grid-template-columns:8.5rem 1fr 7rem 8rem 2rem;gap:1rem;padding:.5rem .75rem;
  font-family:var(--mono);font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
  border-bottom:2px solid var(--ink)}
.row{border-bottom:1px solid var(--rule);background:transparent}
.rowmain{display:grid;grid-template-columns:8.5rem 1fr 7rem 8rem 2rem;gap:1rem;padding:.8rem .75rem;
  align-items:start;width:100%;background:none;border:none;text-align:left;font-family:inherit;color:inherit}
.rowmain:hover{background:var(--panel)}
.score{font-family:var(--mono)}
.score .total{font-weight:600;font-size:1.05rem}
.score .total b{font-size:.7rem;font-weight:400;color:var(--ink-soft)}
.cells{display:flex;gap:3px;margin-top:.35rem}
.cell{width:14px;height:14px;border:1px solid var(--ink);position:relative}
.cell i{position:absolute;inset:0;background:var(--cell);transform-origin:bottom;display:block}
.title{font-family:var(--disp);font-weight:700;font-size:.98rem;line-height:1.3}
.summary{font-size:.88rem;color:var(--ink-soft);margin-top:.25rem;font-style:italic}
.src{font-family:var(--mono);font-size:.68rem;color:var(--ink-soft);margin-top:.3rem;letter-spacing:.03em}
.dl,.st{font-family:var(--mono);font-size:.75rem}
.dl.soon{color:var(--stamp);font-weight:600}
.badge{display:inline-block;border:1px solid currentColor;padding:.15rem .5rem;font-size:.65rem;
  letter-spacing:.1em;text-transform:uppercase}
.badge.new{color:var(--stamp)} .badge.shortlisted{color:var(--amber)}
.badge.drafted,.badge.pitched,.badge.submitted{color:var(--verdi)}
.badge.won{color:var(--verdi);background:var(--verdi);color:var(--paper);border-color:var(--verdi)}
.badge.rejected,.badge.dismissed{color:var(--ink-soft);opacity:.7}
.caret{font-family:var(--mono);color:var(--ink-soft);justify-self:end}

/* ---------- detail ---------- */
.detail{display:none;padding:0 .75rem 1.2rem;grid-column:1/-1}
.row.open .detail{display:block}
.detail .grid{display:grid;grid-template-columns:1fr 20rem;gap:1.5rem;border-left:3px solid var(--stamp);
  padding:.9rem 0 .9rem 1.1rem;margin-left:.1rem}
.rationale{font-size:.9rem;max-width:46rem}
.rationale h4,.dims h4,.actions h4{font-family:var(--mono);font-weight:600;font-size:.65rem;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.4rem}
.dims table{border-collapse:collapse;font-family:var(--mono);font-size:.73rem;margin-bottom:1rem}
.dims td{padding:.15rem .6rem .15rem 0}
.dims td:last-child{font-weight:600}
.actions{display:flex;flex-direction:column;gap:.5rem;align-items:stretch}
.btn{border:1px solid var(--ink);background:var(--panel);padding:.5rem .8rem;font-size:.75rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-align:center;text-decoration:none}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:var(--stamp-ink);font-weight:600}
.btn.primary:hover{background:#5E2222}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions select{font-family:var(--mono);font-size:.75rem;padding:.45rem .5rem;border:1px solid var(--rule);
  background:var(--panel)}
.actions label{font-family:var(--mono);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft)}
.actions textarea{font-family:var(--mono);font-size:.75rem;padding:.4rem .5rem;border:1px solid var(--rule);
  background:var(--panel);resize:vertical;min-height:2.4rem}

/* ---------- empty / notice ---------- */
.empty{padding:3rem 1rem;text-align:center;font-family:var(--mono);font-size:.8rem;color:var(--ink-soft)}
.notice{max-width:76rem;margin:.8rem auto 0;padding:.6rem 1.5rem;font-family:var(--mono);font-size:.72rem;
  color:var(--stamp)}

/* ---------- dialogs & toast ---------- */
dialog{border:2px solid var(--ink);background:var(--paper);padding:1.4rem;max-width:26rem;width:92%;
  font-family:var(--body)}
dialog::backdrop{background:rgba(20,32,30,.55)}
dialog h3{font-family:var(--disp);font-weight:900;font-size:1rem;margin-bottom:.9rem;letter-spacing:.02em}
dialog label{display:block;font-family:var(--mono);font-size:.65rem;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-soft);margin:.7rem 0 .2rem}
dialog input{width:100%;font-family:var(--mono);font-size:.8rem;padding:.45rem .5rem;
  border:1px solid var(--rule);background:var(--panel)}
dialog .drow{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.1rem}
dialog p.hint{font-size:.8rem;color:var(--ink-soft);margin-top:.6rem}
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--paper);font-family:var(--mono);font-size:.75rem;padding:.6rem 1rem;display:none;
  max-width:34rem;z-index:50}
#toast a{color:#9FD8CB}
@media(max-width:52rem){
  .colhead{display:none}
  .rowmain{grid-template-columns:1fr;gap:.4rem}
  .detail .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="wordmark">decolonial.ist<small>Opportunity Monitor</small></div>
    <div class="hmeta">
      <span id="syncInfo">local sample data</span>
      <button id="refreshBtn" title="Reload results">Refresh</button>
      <button id="settingsBtn">Settings</button>
    </div>
  </div>
</header>

<div class="notice" id="notice" hidden></div>

<div class="filters" role="toolbar" aria-label="Filters">
  <button class="chip" data-type="conference" aria-pressed="true">Conference</button>
  <button class="chip" data-type="funding" aria-pressed="true">Funding</button>
  <button class="chip" data-type="media" aria-pressed="true">Media</button>
  <select id="statusFilter" aria-label="Status filter">
    <option value="">status: all</option>
    <option value="active" selected>status: active</option>
    <option>new</option><option>shortlisted</option><option>drafted</option>
    <option>pitched</option><option>submitted</option><option>won</option>
    <option>rejected</option><option>dismissed</option>
  </select>
  <select id="minScore" aria-label="Minimum score">
    <option value="0">score ≥ 0</option><option value="12">score ≥ 12</option>
    <option value="15" selected>score ≥ 15</option><option value="18">score ≥ 18</option>
    <option value="21">score ≥ 21</option>
  </select>
  <select id="sortBy" aria-label="Sort">
    <option value="total">sort: score</option>
    <option value="deadline">sort: deadline</option>
    <option value="found_at">sort: newest</option>
  </select>
  <input type="search" id="search" placeholder="search title / source / summary…" aria-label="Search">
  <span class="count" id="count"></span>
</div>

<main>
  <div class="colhead"><span>Score</span><span>Opportunity</span><span>Deadline</span><span>Status</span><span></span></div>
  <div id="rows"></div>
</main>

<dialog id="settingsDlg">
  <h3>Settings</h3>
  <label for="cfgOwner">GitHub owner (org/user)</label><input id="cfgOwner" placeholder="your-org">
  <label for="cfgRepo">Repository</label><input id="cfgRepo" placeholder="decolonialist-monitor">
  <label for="cfgBranch">Branch</label><input id="cfgBranch" placeholder="main">
  <label for="cfgPat">Fine-grained PAT</label><input id="cfgPat" type="password" placeholder="github_pat_…">
  <p class="hint">Token needs <em>Actions: read&nbsp;and&nbsp;write</em> and
    <em>Contents: read&nbsp;and&nbsp;write</em> on this repo only. Stored in this
    browser's localStorage; sent only to api.github.com.</p>
  <div class="drow">
    <button class="btn" id="cfgCancel">Cancel</button>
    <button class="btn primary" id="cfgSave">Save</button>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script>
"use strict";
/* ---------------- config ---------------- */
const LS = "dcl-monitor-cfg";
const DIMS = [["topical","Topical"],["geographic","Geographic"],["eligibility","Eligibility"],
              ["feasibility","Feasibility"],["reach","Reach"]];
const STATUSES = ["new","shortlisted","drafted","pitched","submitted","won","rejected","dismissed"];
const ACTIVE = new Set(["new","shortlisted","drafted","pitched","submitted"]);
const WORKFLOW = "build-proposal.yml";
let cfg = JSON.parse(localStorage.getItem(LS) || "{}");
cfg.branch = cfg.branch || "main";

/* ---------------- state ---------------- */
let DATA = [], FILE_SHA = null;
const SAMPLE = [
  {
    "id": "sample0000000001",
    "title": "ASN World Convention 2027 — Call for Papers: Nationalism and Empire in the Post-Soviet Space",
    "url": "https://www.nationalities.org/conventions",
    "source": "H-Net Announcements (CFPs, jobs, events)",
    "type": "conference",
    "scores": {"topical": 5, "geographic": 5, "eligibility": 4, "feasibility": 3, "reach": 5},
    "total": 22,
    "deadline": "2026-10-15",
    "summary": "Flagship nationalities-studies convention with explicit post-Soviet empire streams — the single best-fit venue to debut the matrix.",
    "rationale": "Direct intersection of Russian imperialism and decolonization scholarship; individual scholars welcome without institutional affiliation; requires abstract plus travel to New York; field-defining audience.",
    "status": "shortlisted",
    "found_at": 1752537600,
    "proposal": null
  },
  {
    "id": "sample0000000002",
    "title": "EU CERV — Remembrance call: totalitarian regimes and European memory",
    "url": "https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/home",
    "source": "European Endowment for Democracy — news",
    "type": "funding",
    "scores": {"topical": 5, "geographic": 5, "eligibility": 1, "feasibility": 2, "reach": 5},
    "total": 18,
    "deadline": "2027-01-12",
    "summary": "Large EU remembrance grant squarely on-topic, but requires an EU-registered legal entity.",
    "rationale": "Topical and geographic fit are maximal. Eligibility flagged: applicants must be registered legal entities in EU member states — would require an EU fiscal sponsor or consortium partner. Application effort is substantial.",
    "status": "new",
    "found_at": 1752624000,
    "proposal": null
  },
  {
    "id": "sample0000000003",
    "title": "New Eastern Europe — accepting analytical essays on decolonising the study of the region",
    "url": "https://neweasterneurope.eu/",
    "source": "New Eastern Europe — latest (pitch-angle radar)",
    "type": "media",
    "scores": {"topical": 5, "geographic": 5, "eligibility": 5, "feasibility": 4, "reach": 3},
    "total": 22,
    "deadline": null,
    "summary": "Open pitch window at the region's leading English-language analytical outlet — ideal home for the flagship matrix-introduction essay.",
    "rationale": "Perfect topical and geographic fit; open to external contributors; effort is one 2,000-word essay; respected niche audience of exactly the readers who would adopt and cite the knowledge base.",
    "status": "drafted",
    "found_at": 1752710400,
    "proposal": "proposals/sample0000000003-2026-07-18.md"
  }
];

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64decode = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,"")), c=>c.charCodeAt(0)));
const b64encode = s => { const u = new TextEncoder().encode(s); let bin="";
  u.forEach(c=>bin+=String.fromCharCode(c)); return btoa(bin); };
const api = (path, opts={}) => fetch(`https://api.github.com${path}`, { ...opts, headers: {
  "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28",
  ...(cfg.pat ? {"Authorization":`Bearer ${cfg.pat}`} : {}), ...(opts.headers||{}) }});
function toast(html, ms=6000){ const t=$("#toast"); t.innerHTML=html; t.style.display="block";
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", ms); }
const configured = () => cfg.owner && cfg.repo;
const daysTo = d => d ? Math.ceil((new Date(d+"T23:59:59") - Date.now())/864e5) : null;

/* ---------------- data load ---------------- */
async function load(){
  if(!configured()){
    DATA = SAMPLE; FILE_SHA = null;
    $("#syncInfo").textContent = "sample data — set owner/repo in Settings";
    render(); return;
  }
  try{
    const r = await api(`/repos/${cfg.owner}/${cfg.repo}/contents/data/results.json?ref=${cfg.branch}`);
    if(!r.ok) throw new Error(`GitHub ${r.status}`);
    const j = await r.json();
    DATA = JSON.parse(b64decode(j.content)); FILE_SHA = j.sha;
    $("#syncInfo").textContent = `${cfg.owner}/${cfg.repo}@${cfg.branch} · ${DATA.length} records`;
    $("#notice").hidden = true;
  }catch(e){
    DATA = DATA.length ? DATA : SAMPLE;
    $("#notice").textContent = `Could not load results.json from GitHub (${e.message}). ` +
      (cfg.pat ? "Check repo name, branch, and token permissions." :
                 "If the repo is private, add a PAT in Settings.");
    $("#notice").hidden = false;
  }
  render();
}

/* ---------------- rendering ---------------- */
function filtered(){
  const types = new Set([...document.querySelectorAll(".chip[aria-pressed='true']")].map(b=>b.dataset.type));
  const st = $("#statusFilter").value, min = +$("#minScore").value,
        q = $("#search").value.trim().toLowerCase(), sort = $("#sortBy").value;
  let rows = DATA.filter(r =>
    types.has(r.type) && r.total >= min &&
    (st==="" || (st==="active" ? ACTIVE.has(r.status) : r.status===st)) &&
    (!q || `${r.title} ${r.source} ${r.summary}`.toLowerCase().includes(q)));
  rows.sort((a,b)=> sort==="deadline"
      ? (a.deadline||"9999") < (b.deadline||"9999") ? -1 : 1
      : (b[sort]||0) - (a[sort]||0));
  return rows;
}

function cellsHtml(scores){
  return `<span class="cells" aria-hidden="true">` + DIMS.map(([k,label]) => {
    const v = Math.max(0, Math.min(5, scores?.[k] ?? 0));
    return `<span class="cell" title="${label}: ${v}/5"><i style="transform:scaleY(${v/5})"></i></span>`;
  }).join("") + `</span>`;
}

function render(){
  const rows = filtered(), host = $("#rows");
  $("#count").textContent = `${rows.length} / ${DATA.length}`;
  if(!rows.length){ host.innerHTML = `<div class="empty">Nothing matches the current filters.
    The monitor commits new items daily — widen the score or status filters to see more.</div>`; return; }
  host.innerHTML = rows.map(r => {
    const d = daysTo(r.deadline);
    const dl = r.deadline
      ? `<span class="dl ${d!==null && d<=21 ? "soon":""}">${esc(r.deadline)}${d!==null?`<br>${d<0?"passed":"D-"+d}`:""}</span>`
      : `<span class="dl">rolling</span>`;
    return `<article class="row" data-id="${esc(r.id)}">
      <button class="rowmain" aria-expanded="false">
        <span class="score"><span class="total">${r.total}<b> /25</b></span>${cellsHtml(r.scores)}</span>
        <span><span class="title">${esc(r.title)}</span>
          <span class="summary">${esc(r.summary)}</span>
          <span class="src">${esc(r.source)} · ${esc(r.type)} · ${esc(r.id)}</span></span>
        ${dl}
        <span class="st"><span class="badge ${esc(r.status)}">${esc(r.status)}</span></span>
        <span class="caret">▸</span>
      </button>
      <div class="detail">
        <div class="grid">
          <div class="rationale"><h4>Rationale</h4><p>${esc(r.rationale)}</p>
            <p style="margin-top:.6rem"><a href="${esc(r.url)}" target="_blank" rel="noopener">Open source page ↗</a>
            ${r.proposal ? ` · <a href="${ghBlob(r.proposal)}" target="_blank" rel="noopener">Open draft ↗</a>` : ""}</p></div>
          <div>
            <div class="dims"><h4>Dimensions</h4><table>${DIMS.map(([k,l]) =>
              `<tr><td>${l}</td><td>${r.scores?.[k] ?? "–"} / 5</td></tr>`).join("")}</table></div>
            <div class="actions"><h4>Actions</h4>
              <label for="inst-${esc(r.id)}">Guidance for the draft (optional)</label>
              <textarea id="inst-${esc(r.id)}" placeholder="e.g. emphasise the education angle"></textarea>
              <button class="btn primary" data-act="build" data-id="${esc(r.id)}">Build the proposal</button>
              <select data-act="status" data-id="${esc(r.id)}" aria-label="Set status">
                <option value="">set status…</option>
                ${STATUSES.map(s=>`<option ${s===r.status?"disabled":""}>${s}</option>`).join("")}
              </select>
            </div>
          </div>
        </div>
      </div>
    </article>`;
  }).join("");
}
const ghBlob = p => configured()
  ? `https://github.com/${cfg.owner}/${cfg.repo}/blob/${cfg.branch}/${p}` : "#";

/* ---------------- actions ---------------- */
async function buildProposal(id, btn){
  if(!configured() || !cfg.pat){ openSettings("A PAT with Actions write access is needed to dispatch the workflow."); return; }
  btn.disabled = true; btn.textContent = "Dispatching…";
  const instructions = ($(`#inst-${CSS.escape(id)}`)?.value || "").slice(0, 500);
  try{
    const r = await api(`/repos/${cfg.owner}/${cfg.repo}/actions/workflows/${WORKFLOW}/dispatches`,
      { method:"POST", body: JSON.stringify({ ref: cfg.branch,
        inputs: { entity_id: id, proposal_type: "auto", instructions } }) });
    if(r.status !== 204) throw new Error(`GitHub ${r.status}: ${(await r.text()).slice(0,140)}`);
    toast(`Workflow dispatched. The draft commits to <b>/proposals</b> in a couple of minutes —
      <a href="https://github.com/${cfg.owner}/${cfg.repo}/actions" target="_blank" rel="noopener">watch the run ↗</a>,
      then Refresh here.`, 12000);
  }catch(e){ toast(`Dispatch failed — ${esc(e.message)}`); }
  btn.disabled = false; btn.textContent = "Build the proposal";
}

async function setStatus(id, status, sel){
  if(!configured() || !cfg.pat){ openSettings("A PAT with Contents write access is needed to update statuses."); sel.value=""; return; }
  const rec = DATA.find(r=>r.id===id); if(!rec) return;
  const prev = rec.status; rec.status = status; render();
  try{
    // re-read for a fresh sha to avoid clobbering the daily monitor commit
    const cur = await api(`/repos/${cfg.owner}/${cfg.repo}/contents/data/results.json?ref=${cfg.branch}`);
    if(!cur.ok) throw new Error(`read ${cur.status}`);
    const j = await cur.json();
    const remote = JSON.parse(b64decode(j.content));
    const target = remote.find(r=>r.id===id);
    if(target) target.status = status;
    const put = await api(`/repos/${cfg.owner}/${cfg.repo}/contents/data/results.json`,
      { method:"PUT", body: JSON.stringify({
          message:`triage: ${id} -> ${status}`, sha: j.sha, branch: cfg.branch,
          content: b64encode(JSON.stringify(remote, null, 2)) }) });
    if(!put.ok) throw new Error(`write ${put.status}`);
    DATA = remote; FILE_SHA = (await put.json()).content.sha;
    toast(`Status committed: <b>${esc(id)}</b> → ${esc(status)}`);
  }catch(e){ rec.status = prev; toast(`Status update failed — ${esc(e.message)}`); }
  render();
}

/* ---------------- wiring ---------------- */
document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if(chip){ chip.setAttribute("aria-pressed", chip.getAttribute("aria-pressed")!=="true"); render(); return; }
  const main = e.target.closest(".rowmain");
  if(main){ const row = main.closest(".row"); row.classList.toggle("open");
    main.setAttribute("aria-expanded", row.classList.contains("open")); return; }
  const act = e.target.closest("[data-act='build']");
  if(act){ buildProposal(act.dataset.id, act); }
});
document.addEventListener("change", e => {
  const s = e.target.closest("[data-act='status']");
  if(s && s.value){ setStatus(s.dataset.id, s.value, s); }
  else if(["statusFilter","minScore","sortBy"].includes(e.target.id)) render();
});
$("#search").addEventListener("input", render);
$("#refreshBtn").addEventListener("click", load);

/* settings */
function openSettings(msg){ if(msg) toast(esc(msg));
  $("#cfgOwner").value=cfg.owner||""; $("#cfgRepo").value=cfg.repo||"";
  $("#cfgBranch").value=cfg.branch||"main"; $("#cfgPat").value=cfg.pat||"";
  $("#settingsDlg").showModal(); }
$("#settingsBtn").addEventListener("click", ()=>openSettings());
$("#cfgCancel").addEventListener("click", ()=>$("#settingsDlg").close());
$("#cfgSave").addEventListener("click", ()=>{
  cfg = { owner:$("#cfgOwner").value.trim(), repo:$("#cfgRepo").value.trim(),
          branch:$("#cfgBranch").value.trim()||"main", pat:$("#cfgPat").value.trim() };
  localStorage.setItem(LS, JSON.stringify(cfg));
  $("#settingsDlg").close(); load(); });

load();
</script>
</body>
</html>
