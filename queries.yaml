# Standing web-search queries for discovery runs (scripts/discover.py).
# {year} and {year2} are replaced with the current and next year at runtime.
# type: hint passed to scoring (conference|funding|media|other)
# Keep the battery ~25 queries; each costs a web search. Add languages freely —
# scoring handles any language.

# ---- conferences / CFPs ----
- q: call for papers Russian colonialism {year}
