name: monitor

on:
  schedule:
    - cron: "23 6 * * *"   # daily 06:23 UTC (off the :00 rush; jitter is fine)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch sources and diff
        run: python scripts/watch.py

      - name: Score new items
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MIN_TOTAL: "12"
        run: python scripts/score.py

      - name: Commit state and results
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "monitor: $(date -u +%F) run"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi
