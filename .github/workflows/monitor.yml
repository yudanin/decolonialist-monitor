name: monitor

on:
  schedule:
    - cron: "23 6 * * *"   # daily 06:23 UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: "Score current page contents, not just diffs"
        type: boolean
        default: false
      discover:
        description: "Run web-search discovery (queries.yaml)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch sources and diff
        env:
          BACKFILL: ${{ inputs.backfill && '1' || '0' }}
        run: python scripts/watch.py

      - name: Web discovery (Mondays, or on demand)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCOVER: ${{ inputs.discover && '1' || '0' }}
        run: |
          if [ "$DISCOVER" = "1" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "1" ]; }; then
            python scripts/discover.py
          else
            echo "discovery skipped (runs Mondays or with the discover input)"
          fi

      - name: Score new items
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MIN_TOTAL: "12"
        run: python scripts/score.py

      - name: Commit state and results
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "monitor: $(date -u +%F) run"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi
